<!-- sections/dates.html -->
<!-- Dates rendered from data/config.js → DATES array -->
<section id="dates">
  <div class="section-header">
    <div class="section-label">Timeline</div>
    <h2>Important Dates for Paper Submissions</h2>
  </div>
  <p class="note" style="margin-bottom:20px;">
    Paper submission deadlines are end-of-day in <strong>Anywhere on Earth (AoE)</strong> time.
  </p>
  <table class="dates-table">
    <thead>
      <tr>
        <th>Event</th>
        <th>Date</th>
      </tr>
    </thead>
    <tbody id="dates-body">
      <!-- Injected by js/main.js → renderDates() -->
    </tbody>
  </table>
  <p class="note mt-sm">
    Shared task dates are listed separately on the <a href="shared-tasks.html">Shared Tasks</a> page.
  </p>
</section>
